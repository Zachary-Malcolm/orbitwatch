# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every 3 hours so the published satellite catalogue stays current.
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an older one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_URL: https://zachary-malcolm.github.io/orbitwatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Never publish a build whose maths tests fail.
      - run: npm test
      # Mirror CelesTrak's catalogues into the site, so visitors never hit CelesTrak's per-IP download
      # limit. The script reuses the published copy when it is under 2 hours old (so pushes in a row
      # don't re-download), times out rather than hang, never publishes an empty file, and falls back
      # to the last good copy if CelesTrak refuses. Only if there is no copy at all does the site
      # fetch CelesTrak directly in the browser.
      # The last good catalogue from an earlier run, for when CelesTrak refuses a download.
      - name: Restore last good catalogue
        uses: actions/cache/restore@v4
        with:
          path: .celestrak-cache
          key: celestrak-${{ github.run_id }}
          restore-keys: celestrak-
      - name: Fetch satellite catalogue
        continue-on-error: true
        run: bash scripts/mirror-celestrak.sh active active
      # Debris clouds from the four largest break-ups (keep in sync with DEBRIS_GROUPS in src/tle.ts).
      - name: Fetch debris catalogue
        continue-on-error: true
        run: bash scripts/mirror-celestrak.sh debris fengyun-1c-debris cosmos-2251-debris iridium-33-debris cosmos-1408-debris
      - name: Save last good catalogue
        if: hashFiles('.celestrak-cache/*.tle') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .celestrak-cache
          key: celestrak-${{ github.run_id }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
